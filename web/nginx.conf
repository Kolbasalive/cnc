
# HTTP: проверка Let's Encrypt и перенаправление на HTTPS
server {
    listen 80;
    server_name cnc-monitor.ru www.cnc-monitor.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type "text/plain";
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS: основной сайт
server {
    listen 443 ssl;
    server_name cnc-monitor.ru www.cnc-monitor.ru;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/letsencrypt/live/cnc-monitor.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/cnc-monitor.ru/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_host api:8080;
        proxy_pass http://$api_host;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /openapi.yaml {
        set $api_host api:8080;
        proxy_pass http://$api_host;
    }

    location /swagger {
        set $api_host api:8080;
        proxy_pass http://$api_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

