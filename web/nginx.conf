server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Имя api — имя сервиса в compose. Хост в переменной, чтобы nginx
    # резолвил его при запросе, а не один раз при старте.
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_host api:8080;
        proxy_pass http://$api_host;
    }

    location = /openapi.yaml {
        set $api_host api:8080;
        proxy_pass http://$api_host;
    }

    location /swagger {
        set $api_host api:8080;
        proxy_pass http://$api_host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
